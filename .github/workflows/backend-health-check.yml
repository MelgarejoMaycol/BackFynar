name: Backend health check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  BACKEND_URL: ${{ vars.BACKEND_URL }}

jobs:
  health-check:
    name: Check Render backend health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live endpoint
        shell: bash
        run: |
          set -euo pipefail
          : "${BACKEND_URL:?Configure the BACKEND_URL repository variable with the Render backend origin}"
          echo "Checking backend live endpoint..."
          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "${BACKEND_URL%/}/api/v1/health/live"
          echo
          echo "Backend live: OK"

      - name: Check ready endpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking backend ready endpoint..."
          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "${BACKEND_URL%/}/api/v1/health/ready"
          echo
          echo "Backend ready: OK"
