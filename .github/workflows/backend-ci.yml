name: Fynar Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Formatting report
        run: npm run format:check
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Production build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fynar_test
          POSTGRES_PASSWORD: fynar_test
          POSTGRES_DB: fynar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fynar_test -d fynar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      ALLOW_DATABASE_TESTS: "true"
      DATABASE_URL_TEST: postgresql://fynar_test:fynar_test@localhost:5432/fynar_test
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:migrate:test
      - run: npm run prisma:seed:test
      - run: npm run test:integration
