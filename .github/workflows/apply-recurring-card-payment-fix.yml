name: Apply recurring card payment fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-recurring-card-payment-fix.yml'
      - 'scripts/apply-recurring-card-payment-fix.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-recurring-card-payment-fix.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/obligations/obligations.service.ts tests/integration/phase9.test.ts
          git commit -m "fix(recurring): permitir pagos con tarjeta y preservar saldos"
          git push
