name: Fynar Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://fynarback.onrender.com
      FRONTEND_API_URL: https://fynar.vercel.app/api/v1
    steps:
      - name: Wait for deployed API and health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            root_status=$(curl --silent --show-error --max-time 30 -o root.json -w '%{http_code}' "$BASE_URL/" || true)
            health_status=$(curl --silent --show-error --max-time 30 -o health.json -w '%{http_code}' "$BASE_URL/api/v1/health/live" || true)
            ready_status=$(curl --silent --show-error --max-time 30 -o ready.json -w '%{http_code}' "$BASE_URL/api/v1/health/ready" || true)
            if [ "$root_status" = "200" ] && [ "$health_status" = "200" ] && [ "$ready_status" = "200" ]; then
              node - <<'NODE'
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('root.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const ready = JSON.parse(fs.readFileSync('ready.json', 'utf8'));
          if (root?.success !== true || root?.data?.status !== 'ok') process.exit(1);
          if (health?.success !== true || health?.data?.status !== 'ok') process.exit(1);
          if (ready?.success !== true || ready?.data?.ready !== true || ready?.data?.status !== 'connected') process.exit(1);
          NODE
              echo "API y base de datos saludables en intento $attempt"
              exit 0
            fi
            echo "Esperando despliegue de Render ($attempt/30): root=$root_status health=$health_status ready=$ready_status"
            sleep 10
          done
          echo "El backend desplegado no quedó saludable a tiempo"
          exit 1

      - name: Wait for exchange rates and real conversion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            currencies_status=$(curl --silent --show-error --max-time 30 \
              -o currencies.json -w '%{http_code}' \
              "$BASE_URL/api/v1/exchange-rates/currencies" || true)
            convert_status=$(curl --silent --show-error --max-time 30 \
              -o conversion.json -w '%{http_code}' \
              "$BASE_URL/api/v1/exchange-rates/convert?from=COP&to=USD&amount=1000000" || true)
            if [ "$currencies_status" = "200" ] && [ "$convert_status" = "200" ]; then
              if node - <<'NODE'
          const fs = require('node:fs');
          const currencies = JSON.parse(fs.readFileSync('currencies.json', 'utf8'));
          const conversion = JSON.parse(fs.readFileSync('conversion.json', 'utf8'));
          const codes = currencies?.data?.currencies?.map((item) => item.code) ?? [];
          if (!currencies?.success || !codes.includes('COP') || !codes.includes('USD')) process.exit(1);
          if (!conversion?.success) process.exit(1);
          if (conversion?.data?.from !== 'COP' || conversion?.data?.to !== 'USD') process.exit(1);
          if (!(Number(conversion?.data?.rate) > 0)) process.exit(1);
          if (!(Number(conversion?.data?.convertedAmount) > 0)) process.exit(1);
          if (conversion?.data?.provider !== 'frankfurter') process.exit(1);
          NODE
              then
                echo "Divisas desplegadas: catálogo y conversión COP/USD operativos"
                exit 0
              fi
            fi
            echo "Esperando divisas ($attempt/30): currencies=$currencies_status convert=$convert_status"
            sleep 10
          done
          echo "La funcionalidad de divisas no quedó disponible en producción a tiempo"
          cat currencies.json || true
          cat conversion.json || true
          exit 1

      - name: Verify exchange rates through Vercel proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --max-time 30 \
              -o proxy-conversion.json -w '%{http_code}' \
              "$FRONTEND_API_URL/exchange-rates/convert?from=COP&to=USD&amount=1000000" || true)
            if [ "$status" = "200" ]; then
              if node - <<'NODE'
          const fs = require('node:fs');
          const conversion = JSON.parse(fs.readFileSync('proxy-conversion.json', 'utf8'));
          if (!conversion?.success) process.exit(1);
          if (conversion?.data?.from !== 'COP' || conversion?.data?.to !== 'USD') process.exit(1);
          if (!(Number(conversion?.data?.convertedAmount) > 0)) process.exit(1);
          NODE
              then
                echo "Divisas operativas a través del proxy de Vercel"
                exit 0
              fi
            fi
            echo "Esperando proxy de Vercel ($attempt/30): status=$status"
            sleep 10
          done
          echo "La conversión de divisas falla a través del proxy de Vercel"
          cat proxy-conversion.json || true
          exit 1

      - name: Wait for savings goals route to be deployed and protected
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --max-time 30 \
              -o goals-unauthorized.json -w '%{http_code}' \
              "$BASE_URL/api/v1/workspaces/00000000-0000-0000-0000-000000000000/goals" || true)
            cat goals-unauthorized.json || true
            if [ "$status" = "401" ]; then
              echo "Ruta de metas desplegada y protegida correctamente"
              exit 0
            fi
            echo "Esperando ruta de metas ($attempt/30): status=$status"
            sleep 10
          done
          echo "La ruta de metas no quedó disponible/protegida a tiempo"
          exit 1

      - name: Wait for recurring detection and alert center routes
        shell: bash
        run: |
          set -euo pipefail
          workspace="00000000-0000-0000-0000-000000000000"
          for attempt in $(seq 1 30); do
            recurring_status=$(curl --silent --show-error --max-time 30 \
              -o recurring-unauthorized.json -w '%{http_code}' \
              "$BASE_URL/api/v1/workspaces/$workspace/recurring-detection/suggestions?months=12" || true)
            alerts_status=$(curl --silent --show-error --max-time 30 \
              -o alerts-unauthorized.json -w '%{http_code}' \
              "$BASE_URL/api/v1/workspaces/$workspace/notifications/summary" || true)
            if [ "$recurring_status" = "401" ] && [ "$alerts_status" = "401" ]; then
              echo "Partes 5 y 6 desplegadas y protegidas correctamente"
              exit 0
            fi
            echo "Esperando partes 5/6 ($attempt/30): recurring=$recurring_status alerts=$alerts_status"
            sleep 10
          done
          echo "Las rutas de las partes 5/6 no quedaron disponibles/protegidas a tiempo"
          exit 1

      - name: Verify MFA routes are deployed and protected
        shell: bash
        run: |
          set -euo pipefail
          status_code=$(curl --silent --show-error --max-time 30             -o mfa-status-unauthorized.json -w '%{http_code}'             "$BASE_URL/api/v1/auth/mfa/status" || true)
          verify_code=$(curl --silent --show-error --max-time 30             -H 'Content-Type: application/json'             -d '{"challengeToken":"invalid-challenge-token-that-is-long-enough-123456","code":"000000"}'             -o mfa-verify-invalid.json -w '%{http_code}'             "$BASE_URL/api/v1/auth/mfa/verify" || true)

          if [ "$status_code" != "401" ] || [ "$verify_code" != "401" ]; then
            echo "Las rutas MFA no responden como se esperaba: status=$status_code verify=$verify_code"
            cat mfa-status-unauthorized.json || true
            cat mfa-verify-invalid.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const status = JSON.parse(fs.readFileSync('mfa-status-unauthorized.json', 'utf8'));
          const verify = JSON.parse(fs.readFileSync('mfa-verify-invalid.json', 'utf8'));
          if (status?.error?.code !== 'UNAUTHORIZED') process.exit(1);
          if (verify?.error?.code !== 'UNAUTHORIZED') process.exit(1);
          NODE

          echo "Rutas MFA desplegadas y protegidas correctamente"
