name: Fynar Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://backfynar.onrender.com
    steps:
      - name: Wait for deployed API and health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            root_status=$(curl --silent --show-error --max-time 30 -o root.json -w '%{http_code}' "$BASE_URL/" || true)
            health_status=$(curl --silent --show-error --max-time 30 -o health.json -w '%{http_code}' "$BASE_URL/api/v1/health/live" || true)
            if [ "$root_status" = "200" ] && [ "$health_status" = "200" ]; then
              node - <<'NODE'
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('root.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (root?.success !== true || root?.data?.status !== 'ok') process.exit(1);
          if (health?.success !== true) process.exit(1);
          NODE
              echo "API saludable en intento $attempt"
              exit 0
            fi
            echo "Esperando despliegue de Render ($attempt/30): root=$root_status health=$health_status"
            sleep 10
          done
          echo "El backend desplegado no quedó saludable a tiempo"
          exit 1

      - name: Wait for savings goals route to be deployed and protected
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --max-time 30 \
              -o goals-unauthorized.json -w '%{http_code}' \
              "$BASE_URL/api/v1/workspaces/00000000-0000-0000-0000-000000000000/goals" || true)
            cat goals-unauthorized.json || true
            if [ "$status" = "401" ]; then
              echo "Ruta de metas desplegada y protegida correctamente"
              exit 0
            fi
            echo "Esperando ruta de metas ($attempt/30): status=$status"
            sleep 10
          done
          echo "La ruta de metas no quedó disponible/protegida a tiempo"
          exit 1
